name: Windows checks and release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Test native UI preference persistence
        shell: powershell
        run: .\tests\native_ui_preference_smoke.ps1
      - name: Test signed text-service restore ownership
        shell: powershell
        run: .\tests\restore_signed_text_service_smoke.ps1
      - name: Test candidate UI foreground policy
        shell: powershell
        run: .\tests\candidate_ui_policy_smoke.ps1
      - name: Test installer packages every script it loads
        shell: powershell
        run: .\tests\installer_payload_smoke.ps1
      - name: Test installer survives stale PIME state and logs failures
        shell: powershell
        run: .\tests\installer_resilience_smoke.ps1
      - name: Test licence encoding and version consistency
        shell: powershell
        run: .\tests\release_consistency_smoke.ps1
      - name: Test no JSON file carries a UTF-8 BOM
        shell: powershell
        run: .\tests\json_encoding_smoke.ps1
      - name: Test PIME restart reports failure honestly
        shell: powershell
        run: .\tests\restart_pime_smoke.ps1
      - name: Test every control panel button is clickable without error
        shell: powershell
        run: .\tests\control_panel_buttons_smoke.ps1
      - name: Test control panel shell, modules and keymap parity
        shell: powershell
        run: .\tests\control_panel_smoke.ps1
      - name: Test the sync panel actually merges, not just that it clicks
        shell: powershell
        run: .\tests\sync_panel_smoke.ps1
      - name: Test the keymap panel refuses a layout that cannot type every sound
        shell: powershell
        run: .\tests\keymap_panel_smoke.ps1
      - name: Test candidate filter split panes
        shell: powershell
        run: .\tests\hidden_filter_panes_smoke.ps1
      - name: Test health check detects a broken install
        shell: powershell
        run: .\tests\health_check_smoke.ps1
      - name: Test user data backup rotates and restores
        shell: powershell
        run: .\tests\backup_user_data_smoke.ps1
      - name: Test audit tool reports only what it verified
        shell: powershell
        run: .\tests\audit_text_service_smoke.ps1
      - name: Build PIME overlay
        shell: powershell
        run: .\build_pime_overlay.ps1
  keys:
    # 真正按下按鍵、看輸出什麼的測試。音節邊界、按住不放、上下文學習、
    # 詞頻表、全讀音稽核——這些只有這一份在守，而它們需要 32 位元 Python
    # 才載得動 libchewing。之前因此只在本機跑：改完轉接層忘了本機跑，CI 會
    # 全綠而輸入法是壞的。setup-python 給得了 x86，PIME 那兩個檔抓下來就好。
    #
    # 路徑一律用正斜線。反斜線寫進 YAML 會在中途被當成跳脫字元吃掉（\t 變成 Tab、\f 變成換頁），而那種壞法在檔案裡看不出來。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x86"
      - name: Fetch the pinned PIME runtime files
        shell: powershell
        run: ./tools/fetch_pime_runtime.ps1 -Destination pime-ci
      - name: Build PIME overlay
        shell: powershell
        run: ./build_pime_overlay.ps1
      - name: Test key behaviour end to end
        shell: powershell
        env:
          PIME_ROOT: ${{ github.workspace }}/pime-ci
        run: python tests/pime_adapter_smoke.py
      - name: Audit every reading in the index
        shell: powershell
        env:
          PIME_ROOT: ${{ github.workspace }}/pime-ci
        run: python tests/pime_all_readings_audit.py

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, keys]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install NSIS
        shell: powershell
        run: choco install nsis --version=3.12 -y --no-progress
      - name: Build installer
        shell: powershell
        run: .\build_release.ps1
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Smart-Priority-Bopomofo-Setup-0.8.1.exe
            release/SHA256SUMS.txt
