name: Windows checks and release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Test native UI preference persistence
        shell: powershell
        run: .\tests\native_ui_preference_smoke.ps1
      - name: Test signed text-service restore ownership
        shell: powershell
        run: .\tests\restore_signed_text_service_smoke.ps1
      - name: Test candidate UI foreground policy
        shell: powershell
        run: .\tests\candidate_ui_policy_smoke.ps1
      - name: Test installer packages every script it loads
        shell: powershell
        run: .\tests\installer_payload_smoke.ps1
      - name: Test installer survives stale PIME state and logs failures
        shell: powershell
        run: .\tests\installer_resilience_smoke.ps1
      - name: Test licence encoding and version consistency
        shell: powershell
        run: .\tests\release_consistency_smoke.ps1
      - name: Test control panel shell, modules and keymap parity
        shell: powershell
        run: .\tests\control_panel_smoke.ps1
      - name: Build PIME overlay
        shell: powershell
        run: .\build_pime_overlay.ps1

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install NSIS
        shell: powershell
        run: choco install nsis --version=3.12 -y --no-progress
      - name: Build installer
        shell: powershell
        run: .\build_release.ps1
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Smart-Priority-Bopomofo-Setup-0.6.8.exe
            release/SHA256SUMS.txt
